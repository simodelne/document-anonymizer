control_plane:
  version: 1
  session:
    program: document-anonymizer
    binding: identity_channel_program
    concurrency:
      policy: single_active
      on_busy: reject_with_status
  free_text:
    control: ask
    bind:
      query: $text
  controls:
    ask:
      title: Ask
      aliases:
        - /ask
      args:
        query:
          type: string
          required: true
          capture: rest
      dispatch:
        - op: create_session
          as: session
          program: document-anonymizer
          domain_context:
            query: $args.query
        - op: trigger
          session: $session.id
          channel: user_text
          payload: $args.query
          mode: async
    abort:
      title: Abort run
      aliases:
        - /abort
        - /stop
      availability:
        when: active_session.running
      dispatch:
        - op: abort_session
          session: $active_session.id
      presentation:
        priority: destructive
        confirm: true
    new:
      title: New session
      aliases:
        - /new
        - /reset
        - /restart
      dispatch:
        - op: create_session
          as: session
          program: document-anonymizer
      presentation:
        priority: secondary
    history:
      title: Recent sessions
      aliases:
        - /history
        - /recent
      dispatch:
        - op: list_sessions
          as: sessions
      presentation:
        priority: secondary
    status:
      title: Status
      aliases:
        - /status
      availability:
        when: active_session
      dispatch:
        - op: render_session
          session: $active_session.id
          view: status
      presentation:
        priority: contextual
    resume:
      title: Resume
      aliases:
        - /resume
      availability:
        when: active_session
      dispatch:
        - op: send_runtime_control
          session: $active_session.id
          control: resume
      presentation:
        priority: contextual
    help:
      title: Help
      aliases:
        - /help
      dispatch:
        - op: render_help
      presentation:
        priority: secondary
reactions:
  capture_initial_entry_input:
    event: AfterIngestion
    watch:
      - inputs.user_text
    write_scope:
      - inputs.initial_user_text
  save_document_intake:
    event: AfterIngestion
    watch:
      - inputs.document_intake
      - inputs.document_intake.file_refs
      - inputs.document_intake.file_refs.0
      - inputs.document_intake.file_refs.0.fileId
      - inputs.document_intake.status
    write_scope:
      - decisions.documents_received
  settle_document_source:
    event: AfterRound
    watch: []
    write_scope:
      - inputs.source_document_ready
      - inputs.source_document.status
      - inputs.source_document.full_text
      - inputs.source_document.char_count
      - inputs.source_document.file_count
      - inputs.source_document.files_json
      - inputs.source_document.extraction_kind
